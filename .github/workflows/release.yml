name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Generate MCP artifacts
        run: node scripts/generate-mcp.mjs

      - name: Verify MCP artifacts
        run: node scripts/verify-mcp.mjs

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release binaries
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh

      - name: Publish to npm
        if: contains(github.ref, 'tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          bun publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: contains(github.ref, 'tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Squish v${{ steps.version.outputs.version }}
          body: |
            ## What's New in v${{ steps.version.outputs.version }}

            Squish provides universal persistent memory for AI agents with support for MCP, CLI, and HTTP API.

            ### Key Features
            - Two-tier memory architecture (QMD search + SQLite/PostgreSQL storage)
            - Trigger detection, contradiction resolution, and temporal facts
            - Universal API compatible with any AI agent framework
            - MCP server integration for Claude Code, OpenClaw, and other MCP clients

            ### Installation
            ```bash
            npx squish-install
            ```

            Or visit: https://github.com/michielhdoteth/squish

            ## Assets
            Pre-built binaries are available below for Linux, macOS, and Windows.
          files: |
            squish-v${{ steps.version.outputs.version }}-*.tar.gz
            squish-v${{ steps.version.outputs.version }}-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
