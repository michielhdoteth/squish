name: MCP Launch Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate universal MCP artifacts
        run: node scripts/generate-mcp.mjs

      - name: Verify MCP artifacts and reproducibility
        run: node scripts/verify-mcp.mjs

      - name: Installer dry-run checks
        run: |
          node scripts/install-mcp.mjs --client claude-code --dry-run
          node scripts/install-mcp.mjs --client opencode --dry-run
          node scripts/install-mcp.mjs --client codex --dry-run
          node scripts/install-mcp.mjs --client openclaw --dry-run

      - name: OpenClaw bootstrap dry-run
        run: node scripts/openclaw-bootstrap.mjs --dry-run --skip-tool-check

      - name: MCP script tests
        run: bunx vitest run tests/mcp/universal-contract.test.ts tests/mcp/mode-semantics.test.ts tests/mcp/remote-auth-contract.test.ts tests/mcp/generate-mcp-universal.test.ts tests/mcp/install-mcp.test.ts tests/mcp/openclaw-bootstrap.test.ts tests/mcp/verify-mcp.test.ts
